# Copy to .github/workflows/release.yml in the project repository.
name: vibe release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Must be a tag of vibe-backend/sdk, not a branch or SHA; Dependabot can bump it.
    # The reusable workflow is available from v1.0.0-rc.5, the first SDK release
    # tag that contains it.
    # Select that release or later; the SDK tag version must equal your runtime version.
    uses: vibe-backend/sdk/.github/workflows/vibe-project-release.yml@v1.0.0-rc.6
    with:
      environment: release
      llm-model: gpt-4.1-2025-04-14
    secrets:
      llm-api-key: ${{ secrets.VIBE_LLM_API_KEY }} # environment secret in release

# Deploy-side verification (replace placeholders with the project's values):
# gh attestation verify manifest.json --repo <owner>/<repo> \
#   --signer-workflow vibe-backend/sdk/.github/workflows/vibe-project-release.yml \
#   --source-ref refs/tags/v<version> --source-digest <commit> --deny-self-hosted-runners
# VIBE_ENV=production VIBE_RELEASE_VERSION=<version> vibe-runtime verify --artifact dist \
#   --expect-identity 'https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v*' \
#   --expect-issuer https://token.actions.githubusercontent.com --expect-repository-id <id>
