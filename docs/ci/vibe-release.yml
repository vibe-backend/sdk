# Reference workflow for a vibe project (copy to .github/workflows/vibe-release.yml).
#
# - pull_request: informational build preview + policy report in the job
#   summary. Never a deploy source. Uses the low-quota preview LLM key.
# - push to main: build ONCE in the protected `release` environment, attest
#   the manifest (actions/attest-build-provenance), upload it.
# - deploy: verify the attestation (fail closed), then promote the same
#   digest to staging and production without rebuilding.
name: vibe release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VIBE_LLM_API_KEY: ${{ secrets.VIBE_LLM_API_KEY_PREVIEW }}
    steps:
      - uses: actions/checkout@v4
      - name: Install vibe
        run: cargo install --locked --git https://github.com/vibe-backend/sdk vibe
      - name: Build preview and policy report (informational)
        run: |
          set -o pipefail
          {
            echo '## vibe build preview (not a deploy artifact)'
            echo '```'
            LLM_API_KEY="$VIBE_LLM_API_KEY" vibe compile --check --project . 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install vibe
        run: cargo install --locked --git https://github.com/vibe-backend/sdk vibe
      - name: Release build (compile in memory, policy, sign)
        env:
          VIBE_LLM_API_KEY: ${{ secrets.VIBE_LLM_API_KEY }}
          VIBE_RELEASE_SIGNING_KEY: ${{ secrets.VIBE_RELEASE_SIGNING_KEY }}
        run: |
          vibe manifest --project . --release \
            --commit "$GITHUB_SHA" \
            ${{ vars.VIBE_RELEASE_APPROVAL && format('--release-approval {0}', vars.VIBE_RELEASE_APPROVAL) || '' }} \
            -o manifest.json 2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2)
      - id: digest
        run: echo "sha256=$(sha256sum manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json

  deploy:
    needs: release-build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifest
      - name: Same digest as the release build
        run: echo "${{ needs.release-build.outputs.digest }}  manifest.json" | sha256sum -c -
      - name: Verify attestation (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/vibe-release.yml" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Deploy
        run: echo "deploy manifest.json to ${{ matrix.target }} (runtime pins VIBE_MANIFEST_PUBKEY)"
