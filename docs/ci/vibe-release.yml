# Reference workflow for a vibe release (copy to .github/workflows/release.yml).
#
# - pull_request: informational build preview + policy report in the job
#   summary. Never a deploy source. Uses the low-quota preview LLM key.
# - install: build a PINNED vibe once in a job without secrets; later jobs
#   check its digest. Never install a moving ref in a job that holds secrets.
# - push of a v* tag: run the LLM compile and deploy policy (LLM key only),
#   then build ONCE with `vibe build` in the protected `release` environment
#   and sign the manifest keyless with Sigstore (GitHub OIDC -> short-lived
#   Fulcio certificate -> Rekor transparency log) via
#   actions/attest-build-provenance. No signing key exists anywhere.
# - deploy: verify the bundle (fail closed) bound to the repo, this workflow
#   path and the tag ref, then promote the same digest to staging and
#   production without rebuilding. `vibe serve` / `vibe migrate` check the
#   bundle again at startup.
#
# Every action is pinned to a full commit SHA. Only `sign` gets
# `id-token: write` / `attestations: write`; it checks out nothing and runs
# no project code. Pin VIBE_SDK_REV to a full commit SHA of
# vibe-backend/sdk (or replace the install job with a checksummed release
# binary).
name: vibe release

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # WARNING: this pin is a vibe-backend/sdk feature-branch commit (PR #116),
  # not yet on main, so the "Require VIBE_SDK_REV ... on sdk main" step below
  # fails until it is re-pinned. Re-pin to the #116 merge commit on main
  # right after merge; do not copy this template before then.
  VIBE_SDK_REV: 2d9d2cfcaf592c7ac94ec2f54a5ea4f96f3b64b8 # pin: full sdk commit SHA
  # The identity a release must carry. Keep in sync with the runtime's
  # VIBE_RELEASE_REPO / VIBE_RELEASE_WORKFLOW (defaults shown).
  VIBE_RELEASE_REPO: vibe-backend/sdk
  VIBE_RELEASE_WORKFLOW: .github/workflows/release.yml

jobs:
  install:
    # No secrets, no id-token: builds the pinned vibe binary once.
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - name: Require VIBE_SDK_REV to be a full SHA on sdk main
        # Fails closed on a pin that is not reachable from main (for example
        # a feature-branch commit), so no unreleased verifier is installed.
        run: |
          [[ "$VIBE_SDK_REV" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::VIBE_SDK_REV must be a full commit SHA"; exit 1; }
          git init -q sdk && cd sdk
          git fetch -q --filter=blob:none https://github.com/vibe-backend/sdk "+refs/heads/main:refs/sdk/main" "$VIBE_SDK_REV"
          git merge-base --is-ancestor "$VIBE_SDK_REV" refs/sdk/main \
            || { echo "::error::VIBE_SDK_REV $VIBE_SDK_REV is not on vibe-backend/sdk main"; exit 1; }
      - name: Install pinned vibe
        run: cargo install --locked --git https://github.com/vibe-backend/sdk --rev "$VIBE_SDK_REV" vibe --root "$RUNNER_TEMP/vibe"
      - id: sum
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/vibe/bin/vibe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibe-bin
          path: ${{ runner.temp }}/vibe/bin/vibe
          if-no-files-found: error

  preview:
    if: github.event_name == 'pull_request'
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vibe-bin
          path: bin
      - name: Same vibe binary as the install job
        run: echo "${{ needs.install.outputs.sha256 }}  bin/vibe" | sha256sum -c - && chmod +x bin/vibe
      - name: Build preview and policy report (informational)
        env:
          LLM_API_KEY: ${{ secrets.VIBE_LLM_API_KEY_PREVIEW }}
        run: |
          set -o pipefail
          {
            echo '## vibe build preview (not a deploy artifact)'
            echo '```'
            bin/vibe compile --check --project . 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-policy:
    # LLM compile + policy only: holds the LLM key, nothing else.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vibe-bin
          path: bin
      - run: echo "${{ needs.install.outputs.sha256 }}  bin/vibe" | sha256sum -c - && chmod +x bin/vibe
      - name: Compile in memory and run the deploy policy
        env:
          VIBE_LLM_API_KEY: ${{ secrets.VIBE_LLM_API_KEY }}
        run: LLM_API_KEY="$VIBE_LLM_API_KEY" bin/vibe compile --check --project . 2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2)

  release-build:
    # `vibe build` recompiles from source in memory (lock files are never an
    # input) and validates; it takes no signing key. High-risk items fail
    # closed until release-environment approval verification (#80) lands.
    # There is no approval variable or string.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [install, release-policy]
    runs-on: ubuntu-24.04
    environment: release
    # Runs project code, so it gets no id-token / attestations permission;
    # the `sign` job below signs the manifest it uploads.
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vibe-bin
          path: bin
      - run: echo "${{ needs.install.outputs.sha256 }}  bin/vibe" | sha256sum -c - && chmod +x bin/vibe
      - name: Release build (compile in memory, policy; no signing key)
        env:
          VIBE_LLM_API_KEY: ${{ secrets.VIBE_LLM_API_KEY }}
        run: |
          # A release build refuses VIBE_RELEASE_SIGNING_KEY; do not pass it.
          LLM_API_KEY="$VIBE_LLM_API_KEY" bin/vibe build --project . \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --locks-dir "$RUNNER_TEMP/locks" \
            -o manifest.json 2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2)
      - id: digest
        run: echo "sha256=$(sha256sum manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifest
          path: |
            manifest.json
            ${{ runner.temp }}/locks
          if-no-files-found: error

  sign:
    # The only job with id-token / attestations: write. It checks out
    # nothing and runs no project code: it downloads the manifest from this
    # run by exact name, checks its digest and signs it keyless with
    # Sigstore (Fulcio certificate from the GitHub OIDC token, Rekor entry).
    # scripts/check-oidc-permissions.py enforces this shape.
    needs: release-build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
      - name: Same digest as the release build
        run: echo "${{ needs.release-build.outputs.digest }}  manifest.json" | sha256sum -c -
      - name: Sign keyless (Sigstore via GitHub attestation)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: manifest.json
      - name: Keep the Sigstore bundle next to the manifest
        run: cp "${{ steps.attest.outputs.bundle-path }}" manifest.json.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-sigstore-bundle
          path: manifest.json.sigstore.json
          if-no-files-found: error

  deploy:
    needs: [release-build, sign]
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manifest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manifest-sigstore-bundle
      - name: Same digest as the release build
        run: echo "${{ needs.release-build.outputs.digest }}  manifest.json" | sha256sum -c -
      - name: Verify Sigstore bundle (signature, Fulcio identity, Rekor entry; fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify manifest.json \
            --bundle manifest.json.sigstore.json \
            --repo "$VIBE_RELEASE_REPO" \
            --signer-workflow "$VIBE_RELEASE_REPO/$VIBE_RELEASE_WORKFLOW" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners
          case "$GITHUB_REF" in refs/tags/v?*) ;; *) echo "::error::not a v* tag"; exit 1;; esac
      - name: Deploy
        run: |
          echo "deploy manifest.json + manifest.json.sigstore.json to ${{ matrix.target }}"
          echo "vibe serve re-checks the bundle with --expect-version ${GITHUB_REF_NAME#v} --expect-commit $GITHUB_SHA"
