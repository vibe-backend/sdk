[package]
name = "vibe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Markdown-driven serverless backend SDK and the vibe CLI"
readme = "README.md"
rust-version = "1.89"

[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
deadpool-postgres = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1.0"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha1 = "0.11"
sqlparser = { version = "0.52", features = ["visitor"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
