name: negative fixture
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundle
          path: ${{ env.INPUT }}
          if-no-files-found: error
