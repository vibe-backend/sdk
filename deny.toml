# cargo-deny policy (#192). Run locally with `cargo deny check`.
# CI runs it on every pull request (see .github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked)
# fails the check unless it is listed here with a reason and an issue link.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with "MIT OR Apache-2.0" distribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
# Licenses on the list above that no current crate uses are fine.
unused-allowed-license = "allow"
exceptions = []

[bans]
# Duplicate versions are reported but do not fail the check yet; several
# come from ecosystem splits we do not control (rand 0.8/0.9, syn 1/2, ...).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only. Any git or other registry source must be listed here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
