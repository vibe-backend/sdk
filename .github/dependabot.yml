version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # kept back until the RustCrypto crates (sha2, hmac, digest) can be upgraded together, see #149.
    ignore:
      - dependency-name: sha2
        versions: [">=0.11"]
      - dependency-name: hmac
        versions: [">=0.13"]
      - dependency-name: digest
        versions: [">=0.11"]
    groups:
      rustcrypto:
        patterns:
          - "sha2"
          - "hmac"
          - "digest"
        update-types: ["minor", "patch"]
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
