version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # rand 0.10 changed its API and broke CI in Dependabot PR #180 (closed).
      # Hold back until the migration tracked in #181 lands.
      - dependency-name: "rand"
        versions: [">=0.10"]
    groups:
      rustcrypto:
        patterns:
          - "sha2"
          - "hmac"
          - "digest"
          - "argon2"
          - "password-hash"
        update-types: ["minor", "patch"]
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
