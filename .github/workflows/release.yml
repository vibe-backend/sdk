name: Release

on:
  push:
    tags: ["v*"]
  # Dry-run (#134): build + checksums only, contents: read, no attest/release.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - "src/**"
      - "scripts/vibe-install.sh"
      - "tests/install_manager.py"
      - "scripts/ci/release-assets.sh"
      - "tests/release_assets.sh"


permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Required before the first v* tag (#28):
# - Repo ruleset: protect tags matching `v*` (block force-push / deletion; allow only this workflow or admins).
# - Environment `release` with required reviewers (set in repo Settings → Environments).

jobs:
  verify-tag:
    name: Tag commit is on main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tagged commit to be reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

  # #170: install script tests + shellcheck run on dry-run and tag paths.
  install-script:
    name: Install script tests & shellcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install script tests
        run: python3 tests/install_manager.py
      - name: Shellcheck install script
        run: shellcheck scripts/vibe-install.sh
      - name: Release asset binding tests
        run: |
          shellcheck scripts/ci/release-assets.sh tests/release_assets.sh
          tests/release_assets.sh

  build:
    name: ${{ matrix.target }}
    needs: verify-tag
    # Tag push: verify-tag must succeed. Dry-run: verify-tag is skipped.
    if: ${{ !cancelled() && (needs.verify-tag.result == 'success' || (github.event_name != 'push' && needs.verify-tag.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    # Builds run project and dependency code: no id-token, no attestations.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: vibe-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            asset: vibe-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            asset: vibe-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: vibe-aarch64-apple-darwin.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: vibe-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.89"
          targets: ${{ matrix.target }}
      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package tar.gz
        if: endsWith(matrix.asset, '.tar.gz')
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/vibe" staging/vibe
          chmod +x staging/vibe
          tar -C staging -czf "${{ matrix.asset }}" vibe
      - name: Package zip
        if: endsWith(matrix.asset, '.zip')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vibe.exe" staging/vibe.exe
          Compress-Archive -Path staging/vibe.exe -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_ASSETS: >-
        vibe-x86_64-unknown-linux-gnu.tar.gz
        vibe-aarch64-unknown-linux-gnu.tar.gz
        vibe-x86_64-apple-darwin.tar.gz
        vibe-aarch64-apple-darwin.tar.gz
        vibe-x86_64-pc-windows-msvc.zip
    steps:
      - name: Download vibe-x86_64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-unknown-linux-gnu.tar.gz
          path: dl/vibe-x86_64-unknown-linux-gnu.tar.gz
      - name: Download vibe-aarch64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-unknown-linux-gnu.tar.gz
          path: dl/vibe-aarch64-unknown-linux-gnu.tar.gz
      - name: Download vibe-x86_64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-apple-darwin.tar.gz
          path: dl/vibe-x86_64-apple-darwin.tar.gz
      - name: Download vibe-aarch64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-apple-darwin.tar.gz
          path: dl/vibe-aarch64-apple-darwin.tar.gz
      - name: Download vibe-x86_64-pc-windows-msvc.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-pc-windows-msvc.zip
          path: dl/vibe-x86_64-pc-windows-msvc.zip
      - name: SHA256 checksums of the expected assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for n in $RELEASE_ASSETS; do
            [ "$(find "dl/$n" -mindepth 1 | wc -l)" -eq 1 ] && [ -f "dl/$n/$n" ] && [ ! -L "dl/$n/$n" ] \
              || { echo "::error::Artifact $n must hold exactly the file $n"; exit 1; }
            mv -n "dl/$n/$n" "dist/$n"
          done
          cd dist
          sha256sum -- $RELEASE_ASSETS > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  # The only job with id-token/attestations: runs in the `release`
  # environment, checks out nothing and runs no project or dependency code.
  # It downloads each expected release file by name, checks the set against
  # RELEASE_FILES and SHA256SUMS, and attests only those files.
  # RELEASE_FILES = the build matrix `asset` names + SHA256SUMS (keep in sync).
  attest:
    name: Attest build provenance
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_FILES: >-
        vibe-x86_64-unknown-linux-gnu.tar.gz
        vibe-aarch64-unknown-linux-gnu.tar.gz
        vibe-x86_64-apple-darwin.tar.gz
        vibe-aarch64-apple-darwin.tar.gz
        vibe-x86_64-pc-windows-msvc.zip
        SHA256SUMS
    steps:
      - name: Download vibe-x86_64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-unknown-linux-gnu.tar.gz
          path: dl/vibe-x86_64-unknown-linux-gnu.tar.gz
      - name: Download vibe-aarch64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-unknown-linux-gnu.tar.gz
          path: dl/vibe-aarch64-unknown-linux-gnu.tar.gz
      - name: Download vibe-x86_64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-apple-darwin.tar.gz
          path: dl/vibe-x86_64-apple-darwin.tar.gz
      - name: Download vibe-aarch64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-apple-darwin.tar.gz
          path: dl/vibe-aarch64-apple-darwin.tar.gz
      - name: Download vibe-x86_64-pc-windows-msvc.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-pc-windows-msvc.zip
          path: dl/vibe-x86_64-pc-windows-msvc.zip
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dl/SHA256SUMS
      - name: Check the downloaded files against the expected list
        shell: bash
        run: |
          set -euo pipefail
          # Each artifact holds exactly one file with the artifact's name.
          expected="$(for n in $RELEASE_FILES; do printf '%s/%s\n' "$n" "$n"; done | LC_ALL=C sort)"
          found="$(cd dl && find . -mindepth 1 ! -type d -printf '%P\n' | LC_ALL=C sort)"
          if [ "$found" != "$expected" ]; then
            echo "::error::Downloaded files do not match the expected release files"
            diff <(echo "$expected") <(echo "$found") || true
            exit 1
          fi
          if [ -n "$(cd dl && find . -mindepth 1 ! -type d ! -type f -print)" ]; then
            echo "::error::Release files must be regular files"
            exit 1
          fi
          mkdir dist
          for n in $RELEASE_FILES; do
            mv -n "dl/$n/$n" "dist/$n"
          done
          count="$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)"
          [ "$count" -eq "$(echo $RELEASE_FILES | wc -w)" ] || { echo "::error::Duplicate release file names"; exit 1; }
      - name: Check assets against SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # SHA256SUMS lists exactly the expected assets, once each.
          listed="$(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | LC_ALL=C sort)"
          want="$(for n in $RELEASE_FILES; do [ "$n" = SHA256SUMS ] || echo "$n"; done | LC_ALL=C sort)"
          if [ "$listed" != "$want" ] || [ "$(wc -l < SHA256SUMS)" -ne "$(echo "$want" | wc -l)" ]; then
            echo "::error::SHA256SUMS does not list exactly the expected assets"
            exit 1
          fi
          sha256sum --strict -c SHA256SUMS
      - name: Attest the expected release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/vibe-x86_64-unknown-linux-gnu.tar.gz
            dist/vibe-aarch64-unknown-linux-gnu.tar.gz
            dist/vibe-x86_64-apple-darwin.tar.gz
            dist/vibe-aarch64-apple-darwin.tar.gz
            dist/vibe-x86_64-pc-windows-msvc.zip
            dist/SHA256SUMS

  # The publishing job holds only contents: write (no id-token/attestations).
  release:
    name: GitHub Release
    needs: [install-script, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_FILES: >-
        vibe-x86_64-unknown-linux-gnu.tar.gz
        vibe-aarch64-unknown-linux-gnu.tar.gz
        vibe-x86_64-apple-darwin.tar.gz
        vibe-aarch64-apple-darwin.tar.gz
        vibe-x86_64-pc-windows-msvc.zip
        SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src
      - name: Download vibe-x86_64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-unknown-linux-gnu.tar.gz
          path: dl/vibe-x86_64-unknown-linux-gnu.tar.gz
      - name: Download vibe-aarch64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-unknown-linux-gnu.tar.gz
          path: dl/vibe-aarch64-unknown-linux-gnu.tar.gz
      - name: Download vibe-x86_64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-apple-darwin.tar.gz
          path: dl/vibe-x86_64-apple-darwin.tar.gz
      - name: Download vibe-aarch64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-apple-darwin.tar.gz
          path: dl/vibe-aarch64-apple-darwin.tar.gz
      - name: Download vibe-x86_64-pc-windows-msvc.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-pc-windows-msvc.zip
          path: dl/vibe-x86_64-pc-windows-msvc.zip
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dl/SHA256SUMS
      - name: Check the downloaded files against the expected list
        shell: bash
        run: |
          set -euo pipefail
          # Each artifact holds exactly one file with the artifact's name.
          expected="$(for n in $RELEASE_FILES; do printf '%s/%s\n' "$n" "$n"; done | LC_ALL=C sort)"
          found="$(cd dl && find . -mindepth 1 ! -type d -printf '%P\n' | LC_ALL=C sort)"
          if [ "$found" != "$expected" ]; then
            echo "::error::Downloaded files do not match the expected release files"
            diff <(echo "$expected") <(echo "$found") || true
            exit 1
          fi
          if [ -n "$(cd dl && find . -mindepth 1 ! -type d ! -type f -print)" ]; then
            echo "::error::Release files must be regular files"
            exit 1
          fi
          mkdir dist
          for n in $RELEASE_FILES; do
            mv -n "dl/$n/$n" "dist/$n"
          done
          count="$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)"
          [ "$count" -eq "$(echo $RELEASE_FILES | wc -w)" ] || { echo "::error::Duplicate release file names"; exit 1; }
      - name: Check assets against SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # SHA256SUMS lists exactly the expected assets, once each.
          listed="$(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | LC_ALL=C sort)"
          want="$(for n in $RELEASE_FILES; do [ "$n" = SHA256SUMS ] || echo "$n"; done | LC_ALL=C sort)"
          if [ "$listed" != "$want" ] || [ "$(wc -l < SHA256SUMS)" -ne "$(echo "$want" | wc -l)" ]; then
            echo "::error::SHA256SUMS does not list exactly the expected assets"
            exit 1
          fi
          sha256sum --strict -c SHA256SUMS
      # Uploads exactly SHA256SUMS and the files it lists, after
      # `sha256sum -c --strict` and an exact file-set match (no dist/* glob).
      - name: Create release and upload the expected files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: src/scripts/ci/release-assets.sh publish dist "$GITHUB_REF_NAME"

  # Non-tag runs only: rehearse the release job's verify + publish step on the
  # real build artifacts with a stub gh (contents: read, no token, no release).
  tag-path-rehearsal:
    name: Tag path rehearsal (stub publish)
    needs: checksums
    if: ${{ !cancelled() && needs.checksums.result == 'success' && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_FILES: >-
        vibe-x86_64-unknown-linux-gnu.tar.gz
        vibe-aarch64-unknown-linux-gnu.tar.gz
        vibe-x86_64-apple-darwin.tar.gz
        vibe-aarch64-apple-darwin.tar.gz
        vibe-x86_64-pc-windows-msvc.zip
        SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src
      - name: Download vibe-x86_64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-unknown-linux-gnu.tar.gz
          path: dl/vibe-x86_64-unknown-linux-gnu.tar.gz
      - name: Download vibe-aarch64-unknown-linux-gnu.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-unknown-linux-gnu.tar.gz
          path: dl/vibe-aarch64-unknown-linux-gnu.tar.gz
      - name: Download vibe-x86_64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-apple-darwin.tar.gz
          path: dl/vibe-x86_64-apple-darwin.tar.gz
      - name: Download vibe-aarch64-apple-darwin.tar.gz
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-aarch64-apple-darwin.tar.gz
          path: dl/vibe-aarch64-apple-darwin.tar.gz
      - name: Download vibe-x86_64-pc-windows-msvc.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibe-x86_64-pc-windows-msvc.zip
          path: dl/vibe-x86_64-pc-windows-msvc.zip
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dl/SHA256SUMS
      - name: Check the downloaded files against the expected list
        shell: bash
        run: |
          set -euo pipefail
          # Each artifact holds exactly one file with the artifact's name.
          expected="$(for n in $RELEASE_FILES; do printf '%s/%s\n' "$n" "$n"; done | LC_ALL=C sort)"
          found="$(cd dl && find . -mindepth 1 ! -type d -printf '%P\n' | LC_ALL=C sort)"
          if [ "$found" != "$expected" ]; then
            echo "::error::Downloaded files do not match the expected release files"
            diff <(echo "$expected") <(echo "$found") || true
            exit 1
          fi
          if [ -n "$(cd dl && find . -mindepth 1 ! -type d ! -type f -print)" ]; then
            echo "::error::Release files must be regular files"
            exit 1
          fi
          mkdir dist
          for n in $RELEASE_FILES; do
            mv -n "dl/$n/$n" "dist/$n"
          done
          count="$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)"
          [ "$count" -eq "$(echo $RELEASE_FILES | wc -w)" ] || { echo "::error::Duplicate release file names"; exit 1; }
      - name: Verify real artifacts against SHA256SUMS
        run: src/scripts/ci/release-assets.sh verify dist
      - name: Rehearse publish (stub gh) and negative cases on real artifacts
        run: src/tests/release_assets.sh dist
