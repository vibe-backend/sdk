name: Release

on:
  push:
    tags: ["v*"]
  # Dry-run (#134): build + checksums only, contents: read, no attest/release.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - "src/**"
      - "scripts/vibe-install.sh"
      - "tests/install_manager.py"
      - "scripts/ci/release-assets.sh"
      - "tests/release_assets.sh"
      - "scripts/ci/check-*.sh"
      - "scripts/ci/tag-signer-digest.sh"
      - "tests/tag_version.sh"
      - "tests/tag_signer_digest.sh"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Required before the first v* tag (#28):
# - Repo ruleset: protect tags matching `v*` (block force-push / deletion; allow only this workflow or admins).
# - Environment `release` with required reviewers (set in repo Settings → Environments).

jobs:
  verify-tag:
    name: Tag commit is on main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      # Object SHA of refs/tags/v<version>, not the peeled commit. GitHub OIDC
      # writes this into build_signer_digest when a caller pins @v<version>.
      signer_digest: ${{ steps.signer.outputs.signer_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag matches Cargo.toml version
        run: scripts/ci/check-tag-version.sh "$GITHUB_REF_NAME"
      - name: Require the tagged commit to be reachable from main
        id: signer
        run: |
          git fetch --no-tags origin main
          # GITHUB_SHA is the peeled commit on a tag push. The signer digest is
          # the refs/tags/$GITHUB_REF_NAME object (annotated tag object, or the
          # commit for a lightweight tag). actions/checkout in the build job
          # does not fetch that tag object (fetch-depth 1, fetch-tags false),
          # so resolve it here with ls-remote and pass it to build.
          scripts/ci/tag-signer-digest.sh "$GITHUB_REF_NAME" origin/main origin "$GITHUB_SHA" > "$RUNNER_TEMP/tag-signer.txt"
          grep '^signer_digest=' "$RUNNER_TEMP/tag-signer.txt" >> "$GITHUB_OUTPUT"
          grep '^tagged_commit=' "$RUNNER_TEMP/tag-signer.txt"

  # #170: install script tests + shellcheck run on dry-run and tag paths.
  install-script:
    name: Install script tests & shellcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install script tests
        run: python3 tests/install_manager.py
      - name: Shellcheck install script
        run: shellcheck scripts/vibe-install.sh scripts/ci/check-runtime-binary.sh scripts/ci/check-runtime-features.sh scripts/ci/check-tag-version.sh scripts/ci/tag-signer-digest.sh tests/tag_version.sh tests/tag_signer_digest.sh
      - name: Tag version tests
        run: tests/tag_version.sh
      - name: Tag signer digest tests
        run: tests/tag_signer_digest.sh
      - name: Release asset binding tests
        run: |
          shellcheck scripts/ci/release-assets.sh tests/release_assets.sh
          tests/release_assets.sh

  build:
    name: ${{ matrix.target }}
    needs: verify-tag
    # Tag push: verify-tag must succeed. Dry-run: verify-tag is skipped.
    if: ${{ !cancelled() && (needs.verify-tag.result == 'success' || (github.event_name != 'push' && needs.verify-tag.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            sdk_asset: vibe-sdk-x86_64-unknown-linux-gnu.tar.gz
            runtime_asset: vibe-runtime-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            sdk_asset: vibe-sdk-aarch64-unknown-linux-gnu.tar.gz
            runtime_asset: vibe-runtime-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            sdk_asset: vibe-sdk-x86_64-apple-darwin.tar.gz
            runtime_asset: vibe-runtime-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            sdk_asset: vibe-sdk-aarch64-apple-darwin.tar.gz
            runtime_asset: vibe-runtime-aarch64-apple-darwin.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            sdk_asset: vibe-sdk-x86_64-pc-windows-msvc.zip
            runtime_asset: vibe-runtime-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.89"
          targets: ${{ matrix.target }}
      - name: Install NASM (aws-lc-sys, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --version=3.2.0 -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build
        env:
          # Compile-time signer digest (decision 182, src/sigstore.rs Signer::compiled).
          # Tag builds only. This is the refs/tags/v<version> object SHA from
          # verify-tag, which is what OIDC puts in build_signer_digest for
          # @v<version>. github.sha is the peeled commit and is not used here.
          # Dry-runs leave it empty.
          VIBE_SDK_COMMIT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.verify-tag.outputs.signer_digest || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin vibe
          cargo build --release --locked --target ${{ matrix.target }} --no-default-features --bin vibe-runtime
      - name: Check runtime binary separation
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/ci/check-runtime-binary.sh "target/${{ matrix.target }}/release/vibe-runtime" "target/${{ matrix.target }}/release/vibe"
      - name: Package tar.gz
        if: endsWith(matrix.sdk_asset, '.tar.gz')
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/vibe" staging/vibe
          chmod +x staging/vibe
          tar -C staging -czf "${{ matrix.sdk_asset }}" vibe
          cp "target/${{ matrix.target }}/release/vibe-runtime" staging/vibe-runtime
          chmod +x staging/vibe-runtime
          tar -C staging -czf "${{ matrix.runtime_asset }}" vibe-runtime
      - name: Package zip
        if: endsWith(matrix.sdk_asset, '.zip')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vibe.exe" staging/vibe.exe
          Compress-Archive -Path staging/vibe.exe -DestinationPath "${{ matrix.sdk_asset }}"
          Copy-Item "target/${{ matrix.target }}/release/vibe-runtime.exe" staging/vibe-runtime.exe
          Compress-Archive -Path staging/vibe-runtime.exe -DestinationPath "${{ matrix.runtime_asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.sdk_asset }}
          path: ${{ matrix.sdk_asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runtime_asset }}
          path: ${{ matrix.runtime_asset }}
          if-no-files-found: error

  # Tag-only: build provenance for each archive (id-token lives only here).
  attest-build:
    name: Attest build provenance
    needs: [build, checksums]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  checksums:
    name: SHA256SUMS
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256 checksums
        run: |
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  # Tag-only: provenance for SHA256SUMS.
  attest-checksums:
    name: Attest SHA256SUMS
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dist
      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

  # The publishing job holds only contents: write (no id-token/attestations).
  release:
    name: GitHub Release
    needs: [install-script, checksums, attest-build, attest-checksums]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src
      # Uploads exactly SHA256SUMS and the files it lists, after
      # `sha256sum -c --strict` and an exact file-set match (no dist/* glob).
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: src/scripts/ci/release-assets.sh publish dist "$GITHUB_REF_NAME"

  # Non-tag runs only: rehearse the release job's verify + publish step on the
  # real build artifacts with a stub gh (contents: read, no token, no release).
  tag-path-rehearsal:
    name: Tag path rehearsal (stub publish)
    needs: checksums
    if: ${{ !cancelled() && needs.checksums.result == 'success' && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Verify real artifacts against SHA256SUMS
        run: scripts/ci/release-assets.sh verify dist
      - name: Rehearse publish (stub gh) and negative cases on real artifacts
        run: tests/release_assets.sh dist
