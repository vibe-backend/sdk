name: Release

on:
  push:
    tags: ["v*"]
  # Dry-run (#134): build + checksums only, contents: read, no attest/release.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Required before the first v* tag (#28):
# - Repo ruleset: protect tags matching `v*` (block force-push / deletion; allow only this workflow or admins).
# - Environment `release` with required reviewers (set in repo Settings → Environments).

jobs:
  verify-tag:
    name: Tag commit is on main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tagged commit to be reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: verify-tag
    # Tag push: verify-tag must succeed. Dry-run: verify-tag is skipped.
    if: ${{ !cancelled() && (needs.verify-tag.result == 'success' || (github.event_name != 'push' && needs.verify-tag.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: vibe-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            asset: vibe-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            asset: vibe-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: vibe-aarch64-apple-darwin.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: vibe-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.89"
          targets: ${{ matrix.target }}
      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package tar.gz
        if: endsWith(matrix.asset, '.tar.gz')
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/vibe" staging/vibe
          chmod +x staging/vibe
          tar -C staging -czf "${{ matrix.asset }}" vibe
      - name: Package zip
        if: endsWith(matrix.asset, '.zip')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vibe.exe" staging/vibe.exe
          Compress-Archive -Path staging/vibe.exe -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Tag-only: build provenance for each archive (id-token lives only here).
  attest-build:
    name: Attest build provenance
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  checksums:
    name: SHA256SUMS
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256 checksums
        run: |
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  # Tag-only: provenance for SHA256SUMS.
  attest-checksums:
    name: Attest SHA256SUMS
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dist
      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

  # The publishing job holds only contents: write (no id-token/attestations).
  release:
    name: GitHub Release
    needs: [checksums, attest-build, attest-checksums]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite (no --clobber)."
            exit 1
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes
