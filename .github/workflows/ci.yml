name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown lint & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
      - name: Check zh-hant code blocks match English
        run: python3 scripts/check-zh-code-blocks.py
      - name: Install script tests
        run: python3 tests/install_manager.py
      - name: Shellcheck install script
        run: shellcheck scripts/vibe-install.sh

  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Postgres tests fail (not skip) in CI when this is missing.
      VIBE_TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Detect Cargo.toml
        id: detect
        run: echo "present=${{ hashFiles('Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: steps.detect.outputs.present == 'true'
        run: cargo check --locked --all-targets --all-features
      - if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        run: cargo test --locked --all-features
      - if: steps.detect.outputs.present != 'true'
        run: echo "No Cargo.toml yet; skipping Rust checks."
