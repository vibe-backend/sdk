name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown lint & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Cargo.toml
        id: detect
        run: echo "present=${{ hashFiles('Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        run: cargo test --all-features
      - if: steps.detect.outputs.present != 'true'
        run: echo "No Cargo.toml yet; skipping Rust checks."

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Dockerfile
        id: detect
        run: echo "present=${{ hashFiles('Dockerfile') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.detect.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - if: steps.detect.outputs.present != 'true'
        run: echo "No Dockerfile yet; skipping Docker build."
