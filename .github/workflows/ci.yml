name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown lint & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
      - name: Check zh-hant code blocks match English
        run: python3 scripts/check-zh-code-blocks.py
      - name: Install pinned policy-checker dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --no-deps -r scripts/requirements-ci.txt
      - name: Policy checks for jobs that can mint OIDC tokens / write attestations
        run: "$RUNNER_TEMP/venv/bin/python" scripts/check-oidc-permissions.py
      - name: Policy checker tests
        run: "$RUNNER_TEMP/venv/bin/python" tests/oidc_policy.py -v
      - name: Install script tests
        run: python3 tests/install_manager.py
      - name: Shellcheck install script
        run: shellcheck scripts/vibe-install.sh

  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Postgres tests fail (not skip) in CI when this is missing.
      VIBE_TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect Cargo.toml
        id: detect
        run: echo "present=${{ hashFiles('Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: steps.detect.outputs.present == 'true'
        run: cargo check --locked --all-targets --all-features
      - if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: steps.detect.outputs.present == 'true'
        run: cargo test --locked --all-features
      - if: steps.detect.outputs.present == 'true'
        name: Release-profile tests
        run: cargo test --locked --all-features --release --test release_profile --test sigstore_verify
      - if: steps.detect.outputs.present != 'true'
        run: echo "No Cargo.toml yet; skipping Rust checks."
