name: CD

# The SDK is not published as a container image. GitHub Release archives
# are built by release.yml. This workflow does not log in to GHCR or push.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: GHCR image publish disabled
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "ghcr.io/vibe-backend/sdk is not published. Install vibe from GitHub Releases."
