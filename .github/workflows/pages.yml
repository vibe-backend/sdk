name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        env:
          # Canonical URLs default to the org root; override with SITE_URL if needed.
          # Read-only token used to fetch development activity from the GitHub API (public repos only).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Check links
        working-directory: site
        run: npm run check-links
      - name: Keep sample repo paths free (/sample-shop/, /sample-envelope/)
        run: |
          for name in sample-shop sample-envelope; do
            if [ -e "site/dist/$name" ] || [ -L "site/dist/$name" ] || [ -e "site/dist/$name.html" ]; then
              echo "Refusing to publish: org site must not claim /$name/ (owned by vibe-backend/$name)."
              exit 1
            fi
            echo "OK: no $name path in dist."
          done

  # Deploy lives on vibe-backend/vibe-backend.github.io (org root).
  # Only sdk main (after a green build) may request a deploy — never pull_request.
  trigger-org-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger pages.yml on vibe-backend.github.io
        env:
          GH_TOKEN: ${{ secrets.ORG_PAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ORG_PAGES_DISPATCH_TOKEN is not set. Add a fine-grained PAT (Actions: write on vibe-backend/vibe-backend.github.io) as an Actions secret. Daily cron on that repo still rebuilds as a fallback."
            exit 1
          fi
          # workflow_dispatch needs only Actions: write (repository_dispatch would need Contents: write).
          gh api -X POST repos/vibe-backend/vibe-backend.github.io/actions/workflows/pages.yml/dispatches \
            -f ref=main
